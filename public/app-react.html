<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signal (React) — experimental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<!-- React, loaded as plain script tags -- no bundler, no build step, deploys as one static file like the rest of the site -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root {
    --bg: #0F1B1C; --panel: #14252A; --line: #24393A; --text: #E9E4D6;
    --text-muted: #839391; --input-bg: #0B1516;
    --news: #E8A33D; --papers: #6FA8D8; --reviews: #C9836B; --reddit: #8FB878;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Source Serif 4', Georgia, serif; }
  a { color: inherit; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 0 1.5rem 4rem; }
  .mast { border-bottom: 1px solid var(--line); padding: 2rem 0 1.25rem; }
  .mast-row { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 1rem; }
  .wordmark { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 1.7rem; margin: 0; }
  .wordmark span { color: var(--news); }
  .badge { font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; color: var(--text-muted); border: 1px solid var(--line); border-radius: 999px; padding: 0.2rem 0.6rem; }
  .note { color: var(--text-muted); font-size: 0.9rem; margin: 0.6rem 0 0; max-width: 60ch; }
  .note a { color: var(--news); }

  .controls { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; margin: 1.25rem 0; font-family: 'Space Grotesk', sans-serif; }
  .filter { background: transparent; border: 1px solid var(--line); color: var(--text-muted); padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.85rem; font-family: inherit; cursor: pointer; }
  .filter.active { background: var(--dot, var(--news)); color: var(--bg); border-color: transparent; }
  #search { flex: 1; min-width: 200px; background: var(--input-bg); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 0.55rem 0.8rem; font-family: inherit; font-size: 0.85rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--dot, var(--line)); border-radius: 6px; padding: 1rem 1.1rem; }
  .card-meta { font-family: 'Space Grotesk', sans-serif; font-size: 0.76rem; color: var(--text-muted); margin-bottom: 0.5rem; }
  .card-meta .cat { color: var(--dot); }
  .card h2 { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 1.02rem; line-height: 1.35; margin: 0 0 0.4rem; }
  .card h2 a:hover { text-decoration-color: var(--dot); }
  .card p { margin: 0; color: var(--text-muted); font-size: 0.9rem; line-height: 1.5; }
  .empty { font-family: 'Space Grotesk', sans-serif; color: var(--text-muted); padding: 2rem 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const CATEGORIES = [
  { key: 'all', label: 'All' },
  { key: 'news', label: 'News' },
  { key: 'papers', label: 'AI papers' },
  { key: 'reviews', label: 'Reviews' },
  { key: 'reddit', label: 'Reddit' },
];
const CAT_LABEL = { news: 'News', papers: 'AI paper', reviews: 'Review', reddit: 'Reddit' };
const CAT_COLOR = { news: 'var(--news)', papers: 'var(--papers)', reviews: 'var(--reviews)', reddit: 'var(--reddit)' };

function timeAgo(iso) {
  if (!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

async function loadCategory(file, category, mapFn) {
  try {
    const res = await fetch(`data/${file}?_=${Date.now()}`);
    const data = await res.json();
    return (data.items || []).map((raw) => ({ ...mapFn(raw), category }));
  } catch (e) {
    console.error('Failed to load', file, e);
    return [];
  }
}

function Card({ item }) {
  return (
    <article className="card" style={{ '--dot': CAT_COLOR[item.category] }}>
      <div className="card-meta">
        <span className="cat">{CAT_LABEL[item.category]}</span> · {item.source} · {timeAgo(item.published)}
      </div>
      <h2><a href={item.link} target="_blank" rel="noopener">{item.title}</a></h2>
      {item.summary && <p>{item.summary}</p>}
    </article>
  );
}

function App() {
  const [items, setItems] = useState([]);
  const [category, setCategory] = useState('all');
  const [search, setSearch] = useState('');

  useEffect(() => {
    (async () => {
      const [news, papers, reviews, reddit] = await Promise.all([
        loadCategory('news.json', 'news', (i) => i),
        loadCategory('papers.json', 'papers', (i) => ({
          ...i,
          source: (i.authors || []).slice(0, 2).join(', ') + ((i.authors || []).length > 2 ? ' et al.' : ''),
        })),
        loadCategory('reviews.json', 'reviews', (i) => i),
        loadCategory('reddit.json', 'reddit', (i) => i),
      ]);
      const all = [...news, ...papers, ...reviews, ...reddit].sort(
        (a, b) => new Date(b.published || 0) - new Date(a.published || 0)
      );
      setItems(all);
    })();
  }, []);

  const filtered = useMemo(() => {
    const term = search.trim().toLowerCase();
    return items.filter((i) => {
      const matchesCat = category === 'all' || i.category === category;
      const matchesTerm = !term || (i.title || '').toLowerCase().includes(term) || (i.summary || '').toLowerCase().includes(term);
      return matchesCat && matchesTerm;
    });
  }, [items, category, search]);

  return (
    <div className="wrap">
      <div className="mast">
        <div className="mast-row">
          <h1 className="wordmark">Signal<span>.</span></h1>
          <div style={{display:"flex",gap:"0.5rem",alignItems:"center"}}><a href="index.html" className="badge" style={{textDecoration:"none",cursor:"pointer"}}>← Main Dashboard</a><span className="badge">⚛ React build — experimental</span></div>
        </div>
        <p className="note">
          Same data, same styling philosophy, rebuilt with React to see how it feels. The main
          site stays plain HTML/JS at <a href="index.html">index.html</a> — this is a parallel
          experiment, not a replacement. It intentionally skips saved items, sync, and the digest
          archive to stay focused on the core browsing experience.
        </p>
      </div>

      <div className="controls">
        {CATEGORIES.map((c) => (
          <button
            key={c.key}
            className={`filter ${category === c.key ? 'active' : ''}`}
            style={{ '--dot': CAT_COLOR[c.key] }}
            onClick={() => setCategory(c.key)}
          >
            {c.label}
          </button>
        ))}
        <input
          id="search"
          type="search"
          placeholder="Search headlines and summaries…"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
        />
      </div>

      {filtered.length === 0 ? (
        <div className="empty">Nothing matches yet — data may still be loading, or try a different filter.</div>
      ) : (
        <div className="grid">
          {filtered.map((item, idx) => <Card key={item.link + idx} item={item} />)}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
