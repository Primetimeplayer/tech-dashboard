<!-- React, loaded as plain script tags -- no bundler, no build step, deploys as one static file like the rest of the site -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('signal-theme'); } catch (e) {}
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<script>
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('signal-theme'); } catch (e) {}
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<style>
  
:root {
  --font-sans: 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --bg: #F3F8FC;
  --panel: #FFFFFF;
  --panel-raised: #F8FBFE;
  --line: #DCE7F2;
  --text: #14294B;
  --text-muted: #7188A8;
  --input-bg: #FFFFFF;

  --news: #F2A51A;
  --papers: #438BFA;
  --reviews: #8B42E8;
  --reddit: #EF6262;
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% 0%, rgba(205,226,248,.42), transparent 34rem),
    radial-gradient(circle at 88% 12%, rgba(224,238,251,.45), transparent 32rem),
    var(--bg);
  color: var(--text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

a {
  color: inherit;
}

.wrap {
  width: 100%;
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 2rem 5rem;
}

/* Header */

.mast {
  padding: 1.8rem 0 1.35rem;
  border-bottom: 1px solid var(--line);
}

.mast-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 1rem;
}

.wordmark {
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 1.85rem;
  letter-spacing: -1.3px;
  margin: 0;
  color: var(--text);
}

.wordmark span {
  color: var(--papers);
}
  }

.mast-row > div {
  display: flex;
  gap: .6rem;
  align-items: center;
  flex-wrap: wrap;
}  .badge {
    display: inline-flex;
    align-items: center;
    font-family: 'Space Grotesk', sans-serif;
    font-size: .72rem;
    color: var(--text-muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .42rem .75rem;
    background: var(--panel);
  text-decoration: none;
  transition: color .18s ease, border-color .18s ease,
              background .18s ease;
}  .badge:hover {
    color: var(--text);
    border-color: var(--news);
    background: rgba(232,163,61,.06);
  }

.note {
  color: var(--text-muted);
  font-family: var(--font-sans);
  font-size: .95rem;
  line-height: 1.65;
  margin: .9rem 0 0;
  max-width: 66ch;
}

.note a {
  color: var(--news);
  text-underline-offset: 3px;
}

/* ---- React-aware theme state ---- */

/* Theme tokens (index.html contract): --bg / --panel / --panel-raised /
   --line / --text / --text-muted / --input-bg / --news / --papers / --reviews / --reddit.
   The 'light' values are defined first so the default paint of the page matches
   public/index.html's light theme; the 'dark' values below overwrite them on
   <html data-theme="dark">, and .wrap.light-mode then takes over for light mode. */
html[data-theme="dark"] {
  --bg: #0E151B;
  --panel: #14252A;
  --panel-raised: #1D3036;
  --line: #24393A;
  --text: #E9E4D6;
  --text-muted: #839391;
  --input-bg: #0B1516;
  --news: #E8A33D;
  --papers: #6FA8D8;
  --reviews: #C9836B;
  --reddit: #8FB878;
  --surface: #171d27;
  --border: #303846;
  --muted: #a5afbf;
  --accent: #8ba8ff;
}

/* Page shell: body, masthead, wordmark, badge and filter chrome now follow the
   same dark surface as the main dashboard. */
html[data-theme="dark"] body {
  background:
    radial-gradient(circle at 12% 0%, rgba(8, 21, 27, .9), transparent 34rem),
    radial-gradient(circle at 88% 12%, rgba(14, 21, 27, .85), transparent 32rem),
    var(--bg);
  color: var(--text);
}

.mast {
  border-bottom-color: var(--line);
}

.wordmark {
  color: var(--text);
}

.wordmark span {
  color: var(--news);
}

.badge {
  background: var(--panel);
  border-color: var(--line);
  color: var(--text-muted);
}

.controls {
  display: flex;
  gap: .65rem;
  flex-wrap: wrap;
  align-items: center;
  margin: 1.5rem 0 1.4rem;
  padding: .8rem;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel-raised);
  box-shadow: 0 3px 14px rgba(39,77,119,.04);
  backdrop-filter: blur(12px);
}

.filter {
  background: var(--panel-raised);
  border: 1px solid var(--line);
  color: var(--text-muted);
  padding: .62rem 1.05rem;
  border-radius: 999px;
  font-size: .83rem;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  transition:
    background .18s ease,
    color .18s ease,
    border-color .18s ease,
    transform .18s ease,
    box-shadow .18s ease;
}

.filter:hover {
  color: var(--text);
  border-color: var(--dot, var(--news));
  transform: translateY(-1px);
}

.filter.active {
  background: var(--dot, var(--news));
  color: var(--text);
  border-color: transparent;
  box-shadow: 0 3px 10px rgba(53,105,168,.13);
}

#search {
  flex: 1;
  min-width: 220px;
  background: var(--input-bg);
  border: 1px solid var(--line);
  color: var(--text);
  box-shadow: inset 0 1px 2px rgba(39,77,119,.025);
  border-radius: 999px;
  padding: .72rem 1rem;
  font-family: inherit;
  font-size: .84rem;
  outline: none;
  transition: border-color .2s ease, box-shadow .2s ease;
}

#search::placeholder {
  color: var(--text-muted);
}

#search:focus {
  border-color: var(--news);
  box-shadow: 0 0 0 3px rgba(232,163,61,.10);
}

/* Article grid */

.grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1.1rem;
  align-items: stretch;
}

.card {
  min-width: 0;
  position: relative;
  overflow: hidden;
  background: var(--panel-raised);
  border: 1px solid var(--line);
  border-top: 3px solid var(--dot, var(--line));
  border-radius: 14px;
  padding: 1.15rem 1.2rem 1.25rem;
  box-shadow: 0 3px 14px rgba(39, 77, 119, .055);
  transition:
    transform 180ms ease,
    box-shadow 180ms ease,
    border-color 180ms ease,
    background 180ms ease;
}

.card:hover {
  transform: translateY(-3px);
  border-color: #BBD5F1;
  box-shadow: 0 10px 24px rgba(39,77,119,.10);
}

.card-meta {
  font-family: var(--font-sans);
  font-size: .7rem;
  color: #7890AE;
  margin-bottom: .7rem;
  line-height: 1.55;
}

.card-meta .cat {
  color: var(--dot);
  font-weight: 600;
}

.card h2 {
  font-family: var(--font-sans);
  font-weight: 650;
  font-size: 1.02rem;
  letter-spacing: -.35px;
  line-height: 1.42;
  margin: 0 0 .65rem;
  color: #183458;
}

.card h2 a {
  color: #183458;
  text-decoration: none;
  text-decoration-thickness: 1px;
  text-underline-offset: 4px;
}

.card h2 a:hover {
  text-decoration: underline;
  text-decoration-color: var(--dot);
}

.card p {
  font-family: var(--font-sans);
  margin: 0;
  color: var(--text-muted);
  font-size: .88rem;
  line-height: 1.65;
}

.empty {
  font-family: 'Space Grotesk', sans-serif;
  color: var(--text-muted);
  padding: 3rem 1rem;
  text-align: center;
  border: 1px dashed var(--line);
  border-radius: 14px;
  background: var(--panel);
}

/* Keyboard accessibility */

button:focus-visible,
a:focus-visible,
input:focus-visible {
  outline: 2px solid var(--news);
  outline-offset: 3px;
}

/* Responsive layout */

@media (max-width: 900px) {
  .grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .wrap {
    padding-left: 1.4rem;
    padding-right: 1.4rem;
  }
}

@media (max-width: 600px) {
  .wrap {
    padding-left: 1rem;
    padding-right: 1rem;
  }

  .mast {
    padding-top: 1.6rem;
  }

  .wordmark {
    font-size: 1.75rem;
  }

  .grid {
    grid-template-columns: 1fr;
    gap: .85rem;
  }

  .controls {
    gap: .5rem;
    padding: .65rem;
  }

  .filter {
    padding: .55rem .85rem;
    font-size: .78rem;
  }

  #search {
    flex-basis: 100%;
    min-width: 0;
  }

  .card {
    padding: 1.1rem;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    scroll-behavior: auto !important;
    transition-duration: .01ms !important;
    animation-duration: .01ms !important;
  }
}

/* --- Editorial card refinement --- */

.grid {
  gap: 1.2rem;
  align-items: stretch;
}

.card {
  display: flex;
  flex-direction: column;
  min-height: 205px;
  padding: 1.35rem;
  border-radius: 15px;
  background: linear-gradient(
    155deg,
    #1B3035 0%,
    #14252A 100%
  );
  box-shadow: 0 5px 18px rgba(0,0,0,.12);
}

.card-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  font-size: .7rem;
  letter-spacing: .015em;
  margin-bottom: .9rem;
}

.card-meta .cat {
  font-weight: 700;
  letter-spacing: .025em;
}

.card h2 {
  font-size: 1.04rem;
  line-height: 1.48;
  letter-spacing: -.3px;
  margin-bottom: .75rem;
}

.card h2 a {
  color: var(--text);
  transition: color .18s ease;
}

.card h2 a:hover {

}

.card p {

}

.card:hover {

}

@media (max-width: 600px) {
  .card {
    min-height: 0;
    padding: 1.2rem;
  }
}


.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  margin: 1.8rem 0 .8rem;
  font-family: 'Space Grotesk', sans-serif;
}

.results-bar > div {
  display: flex;
  align-items: center;
  gap: .75rem;
}

.results-label {
  font-size: .68rem;

.results-count {

}

.results-context {
  font-size: .75rem;
  color: var(--text-muted);
}

@media (max-width: 600px) {
  .results-bar {
    margin-top: 1.2rem;
  }
}


.search-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  flex: 1 1 190px;
  min-width: 190px;
  max-width: 260px;
}

.search-wrap input {
  width: 100%;

}

.clear-search {
  position: absolute;
  right: 8px;
  border: 0;

.sort-select {

  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.clear-filters:hover {
  border-color: var(--accent, #8ba8ff);
  color: var(--text, #fff);
}


.back-top-wrap {
  display: flex;
  justify-content: center;
  padding: 2rem 0 3rem;
}

.back-top {
  padding: 10px 18px;
  border: 1px solid var(--border, #303846);
  border-radius: 999px;
  background: transparent;
  color: var(--muted, #a5afbf);
  font: inherit;
  cursor: pointer;
  transition: color .2s, border-color .2s, transform .2s;
}

.back-top:hover {

}


.view-toggle {

  padding: 0 14px;
  border: 1px solid var(--border, #303846);
  border-radius: 10px;

  color: var(--text, #fff);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.view-toggle:hover {
  border-color: var(--accent, #8ba8ff);
}

.grid.compact-view {
  gap: 10px;
}

.grid.compact-view .card {
  padding: 14px;
}

.grid.compact-view .card p {

}


.jump-latest {
  min-height: 42px;
  padding: 0 14px;
  border: 1px solid var(--border, #303846);
  border-radius: 10px;
  background: var(--surface, #171d27);
  color: var(--text, #fff);
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}

.jump-latest:hover {
  border-color: var(--accent, #8ba8ff);
}


#reading-progress {
  position: fixed;
  top: 0;
  left: 0;
  width: 0%;
  height: 3px;
  background: var(--accent, #8ba8ff);
  z-index: 9999;
  transition: width .08s linear;
  pointer-events: none;
}

.wrap.light-mode {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --text: #172033;
  --muted: #5d687b;
  --text-muted: #687386;
  --border: #dce2ec;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.wrap.light-mode .card,
.wrap.light-mode .controls,
.wrap.light-mode .search-wrap input,
.wrap.light-mode .sort-select {
  background: #ffffff;
  color: #172033;
  border-color: #dce2ec;
}

.wrap.light-mode .note,
.wrap.light-mode .results-context,
.wrap.light-mode .results-count {
  color: #5d687b;
}

.theme-toggle {
  padding: 8px 12px;
  border: 1px solid var(--border, #303846);
  border-radius: 999px;
  background: transparent;
  color: inherit;
  font: inherit;
  cursor: pointer;
  white-space: nowrap;
}


/* Light theme refinements */
.wrap.light-mode {
  background: #f4f6fa;
  color: #172033;
}

.wrap.light-mode .mast,
.wrap.light-mode .results-bar {
  color: #172033;
}

.wrap.light-mode .wordmark {
  color: #172033;
}

.wrap.light-mode .card {
  background: #ffffff;
  color: #172033;
  border: 1px solid #dce2ec;
  box-shadow: 0 4px 18px rgba(20, 35, 60, 0.05);
}

.wrap.light-mode .card h3,
.wrap.light-mode .card h2 {
  color: #172033;
}

.wrap.light-mode .card p,
.wrap.light-mode .card .meta {
  color: #596579;
}

.wrap.light-mode .controls {
  background: #ffffff;
  border-color: #dce2ec;
}

/* The .filter and .filter.active rules above already use the theme tokens
   (--panel-raised, --line, --text-muted, --text, --dot). These overrides were
   the only rules that painted the category buttons in light gray/white on
   dark mode: they forced light hex values on top of the tokens whenever
   .wrap.light-mode is present. Re-point them at the theme tokens so the
   buttons follow the same light/dark switch as the other React controls.
   In dark mode .wrap.light-mode is absent, so the theme tokens from
   html[data-theme="dark"] (or the native prefers-color-scheme fallback)
   paint these buttons correctly. */

.wrap.light-mode .filter {
  color: var(--text-muted);
  border-color: var(--line);
}

.wrap.light-mode .filter.active {
  color: var(--text);
}

.wrap.light-mode .search-wrap input,
.wrap.light-mode .sort-select {
  background: transparent;
  color: #172033;
  border-color: #d1d95e;
}

.wrap.light-mode .clear-filters,
.wrap.light-mode .view-toggle,
.wrap.light-mode .jump-latest,
.wrap.light-mode .theme-toggle {
  color: #344158;
  border-color: #cbd5e2;
}

.wrap.light-mode .note,
.wrap.light-mode .results-context,
.wrap.light-mode .results-count {
  color: #596579;
}


/* Final light-mode contrast adjustments */
.wrap.light-mode .card h3,
.wrap.light-mode .card h2,
.wrap.light-mode .card a {
  color: #243149 !important;
}

.wrap.light-mode .card p {
  color: #596579 !important;
}

.wrap.light-mode .search-wrap input {
  background: transparent;
  color: #172033;
  border-color: #cbd5e2;
}

.wrap.light-mode .search-wrap input::placeholder {
  color: #778398;
}

.wrap.light-mode .jump-latest {
  background: #ffffff;
  color: #344158;
}

.wrap.light-mode .results-count {
  background: #e8eef7;
  color: #344158;
}

.wrap.light-mode .filter.active {
  background: var(--dot, var(--news));
  color: var(--text);
  border-color: transparent;
}


.search-hint {
  margin-top: 6px;
  color: var(--muted);
  font-size: 11px;
}

.search-hint kbd {
  padding: 2px 5px;
  border: 1px solid var(--border);

  font: inherit;
}


/* Compact editorial masthead */
.mast {
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border);
}

.mast-row {
  min-height: 38px;
}

.mast-heading {

}

.mast-eyebrow {

}

.mast-heading h2 {

}

.mast-heading p {

  font-size: 13px;
}

.mast-heading > .badge {
  margin-bottom: 0;
}

.results-bar {
  margin-top: 14px;
}


/* Transparent search field in both themes */
.search-wrap input {
  background: transparent !important;
}

.wrap.light-mode .search-wrap input {
  background: transparent !important;
}




/* Shared editorial content alignment */
.mast,
.controls,
.results-bar,
.grid {
  width: 100%;
  box-sizing: border-box;
}

.results-bar {
  padding-left: 0;
  padding-right: 0;
}

.grid {
  margin-left: 0;
  margin-right: 0;
}

/* Full-width toolbar alignment */
.controls {
  width: 100%;
  box-sizing: border-box;
}

@media (min-width: 1000px) {
  .controls {
    display: flex;
    align-items: center;
  }

  .search-wrap {
    flex: 1 1 auto;
    min-width: 120px;
    max-width: none;
  }

  .search-wrap input {
    width: 100%;
    box-sizing: border-box;
  }
}

/* Compact desktop filter toolbar */
@media (min-width: 1000px) {
  .controls {
    flex-wrap: nowrap;
    gap: 7px;
    padding: 10px;
  }

  .controls .filter,
  .controls .clear-filters,
  .controls .view-toggle,
  .controls .jump-latest {
    padding: 9px 12px;
    font-size: 12px;
    white-space: nowrap;
  }

  .search-wrap {
    flex: 1 1 160px;
    min-width: 140px;
    max-width: 220px;
  }

  .search-wrap input {
    min-width: 0;
    padding: 10px 28px 10px 12px;
    font-size: 12px;
  }

  .search-hint {
    display: none;
  }

  .sort-select {
    min-width: 0;
    padding: 0 8px;
    font-size: 12px;
  }
}

/* Final unified compact header */
.mast {
  padding: 12px 0 14px;
  border-bottom: 1px solid var(--border);
}

.mast-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  min-height: 38px;
}

.mast-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.mast-heading {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  margin-top: 12px;
}

.mast-eyebrow {
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .12em;
}

.mast-heading h2 {
  margin: 0;
  font-size: 28px;
  line-height: 1.1;
  letter-spacing: -.04em;
}

.mast-heading p {
  margin: 5px 0 0;
  color: var(--muted);
  font-size: 13px;
}

.mast-heading > .badge {
  margin-bottom: 0;
}

@media (max-width: 600px) {
  .mast-heading {
    align-items: flex-start;
    flex-direction: column;
    gap: 8px;
    margin-top: 12px;
  }
}


/* Latest Stories — compact editorial strip */
.react-latest {
  margin: 18px 0 22px;
  padding: 14px;  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--panel-raised);
  box-shadow: 0 3px 14px rgba(44,93,145,.045);
}

.react-latest-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 2px 12px;
}

.react-latest-heading h2 {
  margin: 0;
  color: var(--text);
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.025em;
}

.react-latest-heading span {
  color: var(--text-muted);
  font-size: 11px;
}

.react-latest-row {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 0 4px;
  scroll-snap-type: x proximity;
  scrollbar-width: thin;
  scrollbar-color: var(--panel-raised) transparent;
}  .react-latest-card {
    flex: 0 0 190px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: transparent;
  color: var(--text);
  text-decoration: none;
  scroll-snap-align: start;
  transition: border-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
}

.react-latest-card:hover {
  transform: translateY(-2px);  border-color: var(--line);
  box-shadow: 0 5px 14px rgba(45,95,150,.08);
}

.react-latest-card .cat {
  color: var(--text-muted);
  font-size: 10px;
  line-height: 1.3;
}

.react-latest-card strong {
  color: var(--text);
  line-height: 1.45;
  font-weight: 650;
}

@media (max-width: 600px) {
  .react-latest {
    padding: 11px;
    margin: 14px 0 18px;
  }

  .react-latest-card {
    flex-basis: 170px;
    min-height: 88px;
  }
}

/* Category navigation — one transparent row, Google News style.
   Later than the pill .filter rules so it wins, including the light-mode
   overrides that repaint active filters as filled accent tabs. */
.category-nav {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  gap: 2px;
  width: 100%;
  margin: 14px 0 4px;
  padding: 0;
  overflow-x: auto;
  background: transparent;
  border: 0;
  box-shadow: none;
  scrollbar-width: none;
}

.category-nav::-webkit-scrollbar {
  display: none;
}

.category-nav .filter,
.wrap.light-mode .category-nav .filter {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  margin: 0;
  padding: 8px 12px;
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  color: var(--text-muted);
  font: 500 14px/1.2 var(--font-sans);
  white-space: nowrap;
  transform: none;
  text-decoration: none;
}

.category-nav .filter:hover,
.wrap.light-mode .category-nav .filter:hover {
  background: rgba(127, 127, 127, 0.12);
  border: 0;
  box-shadow: none;
  color: var(--text);
  transform: none;
}

.category-nav .filter.active,
.wrap.light-mode .category-nav .filter.active {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  color: var(--text);
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 2px;
  transform: none;
}

.category-nav .nav-emoji {
  font-size: 15px;
  line-height: 1;
}

/* Categories and the feed controls share one scrolling row. */
.header-tools {
  display: flex;
  flex-direction: row;
  flex-wrap: nowrap;
  align-items: center;
  gap: 12px;
  overflow-x: auto;
  width: 100%;
  margin: 14px 0 10px;
  scrollbar-width: none;
}

.header-tools::-webkit-scrollbar {
  display: none;
}

.header-tools .category-nav {
  display: contents;
}

.header-tools .search-wrap {
  flex: 0 0 auto;
  min-width: 0;
  max-width: none;
}

.header-tools #search {
  flex: none;
  width: auto;
  min-width: 0;
  max-width: 28ch;
  field-sizing: content;
  box-sizing: border-box;
}

.header-tools .search-hint {
  display: none;
}

.header-tools .sort-select,
.header-tools .jump-latest,
.header-tools .view-toggle,
.header-tools .clear-filters {
  flex: 0 0 auto;
}

/* Feed controls use the same flat text treatment as the category links. */
.header-tools #search,
.wrap.light-mode .header-tools #search,
.header-tools .sort-select,
.wrap.light-mode .header-tools .sort-select,
.header-tools .jump-latest,
.wrap.light-mode .header-tools .jump-latest,
.header-tools .view-toggle,
.wrap.light-mode .header-tools .view-toggle,
.header-tools .clear-filters,
.wrap.light-mode .header-tools .clear-filters {
  margin: 0;
  min-height: 0;
  height: auto;
  padding: 8px 12px;
  background-color: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  color: var(--text-muted);
  font: 500 14px/1.2 var(--font-sans);
  white-space: nowrap;
  transform: none;
  cursor: pointer;
}

.header-tools #search,
.wrap.light-mode .header-tools #search {
  cursor: text;
}

.header-tools #search:not(:placeholder-shown),
.wrap.light-mode .header-tools #search:not(:placeholder-shown) {
  padding-right: 28px;
}

.header-tools #search::placeholder,
.wrap.light-mode .header-tools #search::placeholder {
  color: var(--text-muted);
  opacity: 1;
}

.header-tools #search::-webkit-search-cancel-button,
.header-tools #search::-webkit-search-decoration {
  -webkit-appearance: none;
  appearance: none;
  display: none;
}

.header-tools .sort-select,
.wrap.light-mode .header-tools .sort-select {
  appearance: none;
  padding-right: 22px;
  background-image:
    linear-gradient(45deg, transparent 50%, currentColor 50%),
    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 14px) center, calc(100% - 9px) center;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.header-tools .sort-select option {
  color: var(--text);
  background: var(--panel);
}

.header-tools #search:hover,
.header-tools #search:focus,
.wrap.light-mode .header-tools #search:hover,
.wrap.light-mode .header-tools #search:focus {
  background-color: rgba(127, 127, 127, 0.12) !important;
  border: 0;
  box-shadow: none;
  color: var(--text);
}

.header-tools .sort-select:hover,
.header-tools .jump-latest:hover,
.header-tools .view-toggle:hover,
.header-tools .clear-filters:hover,
.wrap.light-mode .header-tools #search:hover,
.wrap.light-mode .header-tools #search:focus,
.wrap.light-mode .header-tools .sort-select:hover,
.wrap.light-mode .header-tools .jump-latest:hover,
.wrap.light-mode .header-tools .view-toggle:hover,
.wrap.light-mode .header-tools .clear-filters:hover {
  background-color: rgba(127, 127, 127, 0.12);
  border: 0;
  box-shadow: none;
  color: var(--text);
  transform: none;
}

.header-tools .view-toggle[aria-pressed="true"],
.wrap.light-mode .header-tools .view-toggle[aria-pressed="true"] {
  background-color: transparent;
  color: var(--text);
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 6px;
  text-decoration-thickness: 2px;
}

.header-tools #search:focus,
.header-tools .sort-select:focus {
  outline: none;
}

.header-tools #search:focus-visible,
.header-tools .sort-select:focus-visible,
.header-tools .jump-latest:focus-visible,
.header-tools .view-toggle:focus-visible,
.header-tools .clear-filters:focus-visible {
  outline: 2px solid var(--news);
  outline-offset: 3px;
}

.header-tools .clear-search {
  top: 50%;
  right: 2px;
  padding: 0 4px;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
  line-height: 1;
}

</style>
</head>
<body>
<div id="reading-progress"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

const CATEGORIES = [
  { key: 'all', label: 'All News', emoji: '✦' },
  { key: 'software', label: 'Software & Dev', emoji: '⌘' },
  { key: 'papers', label: 'AI & Research', emoji: '🔬' },
  { key: 'chips', label: 'Chips & Silicon', emoji: '▣' },
  { key: 'gaming', label: 'Gaming & Consoles', emoji: '🎮' },
  { key: 'space', label: 'Space & Rockets', emoji: '🚀' },
  { key: 'security', label: 'Cybersecurity', emoji: '🛡' },
  { key: 'gadgets', label: 'Gadgets & Hardware', emoji: '📱' },
];
const CAT_LABEL = { news: 'News', papers: 'AI paper', reviews: 'Review', reddit: 'Reddit' };
const CAT_COLOR = {
  all: 'var(--news)',
  news: 'var(--news)',
  software: 'var(--news)',
  papers: 'var(--papers)',
  chips: 'var(--reviews)',
  gaming: 'var(--reddit)',
  space: 'var(--news)',
  security: 'var(--papers)',
  gadgets: 'var(--reviews)',
  reviews: 'var(--reviews)',
  reddit: 'var(--reddit)',
};
const VERTICALS = {
  software: ['software', 'developer', 'programming', 'github', 'linux', 'windows', 'open source', 'open-source', 'javascript', 'python'],
  chips: ['chip', 'chips', 'silicon', 'semiconductor', 'nvidia', 'amd', 'intel', 'tsmc', 'gpu', 'cpu', 'qualcomm', 'wafer'],
  gaming: ['game', 'games', 'gaming', 'console', 'playstation', 'xbox', 'nintendo', 'steam', 'esports'],
  space: ['spacex', 'nasa', 'rocket', 'rockets', 'satellite', 'orbit', 'lunar', 'astronaut', 'apollo'],
  security: ['security', 'cybersecurity', 'ransomware', 'vulnerability', 'malware', 'breach', 'encrypt', 'encryption'],
  gadgets: ['laptop', 'smartphone', 'iphone', 'android', 'tablet', 'macbook', 'ipad', 'headphone', 'wearable', 'gadget', 'gpu', 'cpu', 'chip'],
};
function matchesKeywords(item, words) {
  const text = `${item.title || ''} ${item.summary || ''}`.toLowerCase();
  return words.some((word) => {
    const body = String(word).toLowerCase().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return new RegExp(`(?:^|[^a-z0-9])${body}(?:[^a-z0-9]|$)`).test(text);
  });
}
function isPromoTitle(title) {
  return /\b(coupons?|promo[\s-]*codes?|discounts?|lingerie)\b/i.test(title || '');
}
function matchesVertical(item, filter) {
  if (!filter || filter === 'all') return true;
  if (filter === 'news' || filter === 'papers' || filter === 'reviews' || filter === 'reddit') return item.category === filter;
  const words = VERTICALS[filter];
  return words ? matchesKeywords(item, words) : item.category === filter;
}

function CategoryNav({ category, onSelect }) {
  return (
    <nav className="category-nav" aria-label="Categories">
      {CATEGORIES.map((c) => (
        <button
          key={c.key}
          type="button"
          className={`filter ${category === c.key ? 'active' : ''}`}
          style={{ '--dot': CAT_COLOR[c.key] }}
          aria-pressed={category === c.key}
          onClick={() => onSelect(c.key)}
        >
          <span className="nav-emoji" aria-hidden="true">{c.emoji}</span>
          <span className="nav-label">{c.label}</span>
        </button>
      ))}
    </nav>
  );
}

function timeAgo(iso) {
  if (!iso) return '';
  const mins = Math.floor((Date.now() - new Date(iso).getTime()) / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  return `${Math.floor(hrs / 24)}d ago`;
}

async function loadCategory(file, category, mapFn) {
  try {
    const res = await fetch(`data/${file}?_t=${Date.now()}`, {
      cache: 'no-store',
      headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' },
    });
    const data = await res.json();
    return (data.items || []).map((raw) => ({ ...mapFn(raw), category }));
  } catch (e) {
    console.error('Failed to load', file, e);
    return [];
  }
}

function Card({ item }) {
  return (
    <article className="card" style={{ '--dot': CAT_COLOR[item.category] }}>
      <div className="card-meta">
        <span className="cat">{CAT_LABEL[item.category]}</span> · {item.source} · {timeAgo(item.published)}
      </div>
      <h2><a href={item.link} target="_blank" rel="noopener noreferrer">{item.title}</a></h2>
      {item.summary && <p>{item.summary}</p>}
    </article>
  );
}

function App() {
  const [items, setItems] = useState([]);
  const [category, setCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [lightMode, setLightMode] = useState(
    () => document.documentElement.getAttribute("data-theme") === "light"
  );
  const [lastUpdated, setLastUpdated] = useState(null);
  const latestItems = useMemo(
    () => items
      .filter(i => i.published && !Number.isNaN(new Date(i.published).getTime()) && !isPromoTitle(i.title))
      .slice(0, 10),
    [items]
  );

  useEffect(() => {
    const handleShortcut = (e) => {
      const target = e.target;
      const typing = target instanceof HTMLElement &&
        (target.isContentEditable ||
         ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName));

      if (e.key === "/" && !typing) {
        e.preventDefault();
        document.getElementById("search")?.focus();
      }

      if (e.key === "Escape" && target?.id === "search") {
        setSearch("");
        target.blur();
      }
    };

    window.addEventListener("keydown", handleShortcut);
    return () => window.removeEventListener("keydown", handleShortcut);
  }, []);

  const clearFilters = () => {
    setCategory("all");
    setSearch("");
  };

  useEffect(() => {
    let cancelled = false;
    const load = async () => {
      const [news, papers, reviews, reddit] = await Promise.all([
        loadCategory('news.json', 'news', (i) => i),
        loadCategory('papers.json', 'papers', (i) => ({
          ...i,
          source: (i.authors || []).slice(0, 2).join(', ') + ((i.authors || []).length > 2 ? ' et al.' : ''),
        })),
        loadCategory('reviews.json', 'reviews', (i) => i),
        loadCategory('reddit.json', 'reddit', (i) => i),
      ]);
      if (cancelled) return;
      const all = [...news, ...papers, ...reviews, ...reddit]
        .filter((item) => !isPromoTitle(item.title))
        .sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
      setItems(all);
      setLastUpdated(new Date());
    };
    load();
    const timer = setInterval(load, 300000);
    return () => {
      cancelled = true;
      clearInterval(timer);
    };
  }, []);

  const filtered = useMemo(() => {
    const term = search.trim().toLowerCase();
    const results = items.filter((i) => {
      if (isPromoTitle(i.title)) return false;
      const matchesCat = matchesVertical(i, category);
      const matchesTerm = !term || (i.title || '').toLowerCase().includes(term) || (i.summary || '').toLowerCase().includes(term);
      return matchesCat && matchesTerm;
    });

    return [...results].sort((a, b) => {
      const dateA = new Date(a.date || a.published || 0).getTime();
      const dateB = new Date(b.date || b.published || 0).getTime();
      return dateB - dateA;
    });
  }, [items, category, search]);

  useEffect(() => {
    document.documentElement.setAttribute('data-theme', lightMode ? 'light' : 'dark');
  }, [lightMode]);

  return (
    <div className={`wrap ${lightMode ? "light-mode" : ""}`}>
      <header className="mast">
        <div className="mast-row">
          <h1 className="wordmark">Signal<span>.</span></h1>

          <nav className="mast-actions" aria-label="Site navigation">
            <a href="index.html" className="badge">Main Dashboard</a>
            <a href="digests.html" className="badge">Digests</a>
            <button
              type="button"
              className="theme-toggle"
              onClick={() => {
                setLightMode(mode => {
                  const next = !mode;
                  localStorage.setItem("signal-theme", next ? "light" : "dark");
                  return next;
                });
              }}
              aria-pressed={lightMode}
            >
              {lightMode ? "☾ Dark mode" : "☀ Light mode"}
            </button>
          </nav>
        </div>

        <div className="mast-heading">
          <div>
            <div className="mast-eyebrow">THE DAILY BRIEFING</div>
            <h2>Top stories</h2>
            <p>Technology, research, and ideas worth your attention.</p>
          </div>
        </div>
      </header>
      <div className="header-tools">
        <CategoryNav category={category} onSelect={setCategory} />
        <div className="search-wrap">
          <input
            id="search"
            type="search"
            placeholder="Search"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
          />
          <div className="search-hint">
            Press <kbd>/</kbd> to search · <kbd>Esc</kbd> to clear
          </div>
          {search && (
            <button
              type="button"
              className="clear-search"
              onClick={() => setSearch("")}
              aria-label="Clear search"
            >
              ×
            </button>
          )}
        </div>
        <button
          type="button"
          className="jump-latest"
          onClick={() => {
            window.scrollTo({ top: 0, behavior: "smooth" });
          }}
        >
          ↓ Latest
        </button>
        <button
          type="button"
          className="clear-filters"
          onClick={clearFilters}
        >
          Clear filters
        </button>
      </div>
<div className="results-bar">
  <div>
    <span className="results-label">YOUR FEED</span>
    <span className="results-count">
      Showing {filtered.length} of {items.length} {items.length === 1 ? 'story' : 'stories'}
    </span>
    {lastUpdated && (
      <span className="results-context">
        Updated {lastUpdated.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
      </span>
    )}
  </div>
  <span className="results-context">
    {[
      category === 'all'
        ? null
        : CATEGORIES.find(c => c.key === category)?.label,
      search.trim() ? `Search: ${search.trim()}` : null
    ].filter(Boolean).join(' · ') || 'All categories'}
  </span>
</div>
      {latestItems.length > 0 && (
        <section className="react-latest" aria-label="Latest stories">
          <div className="react-latest-heading">
            <h2>Latest Stories</h2>
            <span>10 newest available</span>
          </div>
          <div className="react-latest-row">
            {latestItems.map((item, idx) => (
              <a
                className="react-latest-card"
                key={item.link + idx}
                href={item.link}
                target="_blank"
                rel="noopener noreferrer"
              >
                <span className="cat">{CAT_LABEL[item.category]} · {timeAgo(item.published)}</span>
                <strong>{item.title}</strong>
              </a>
            ))}
          </div>
        </section>
      )}

      {filtered.length === 0 ? (
        <div className="empty">
  <h3>No stories found</h3>
  <p>Try another search or reset your filters to see all available stories.</p>
  <button
    type="button"
    className="clear-filters"
    onClick={clearFilters}
  >
    Reset filters
  </button>
</div>
      ) : (
        <div className="grid">
          {filtered.map((item, idx) => <Card key={item.link + idx} item={item} />)}
        </div>
      )}

      <div className="back-top-wrap">
        <button
          type="button"
          className="back-top"
          onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
        >
          ↑ Back to top
        </button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

<script>
(() => {
  const bar = document.getElementById("reading-progress");
  let ticking = false;

  const update = () => {
    const max = document.documentElement.scrollHeight - window.innerHeight;
    const progress = max > 0 ? (window.scrollY / max) * 100 : 0;
    bar.style.width = Math.min(100, Math.max(0, progress)) + "%";
    ticking = false;
  };

  window.addEventListener("scroll", () => {
    if (!ticking) {
      window.requestAnimationFrame(update);
      ticking = true;
    }
  }, { passive: true });

  window.addEventListener("resize", update);
  update();
})();
</script>
\n</body>
