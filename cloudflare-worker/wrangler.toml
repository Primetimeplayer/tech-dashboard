name = "signal-sync"
main = "worker.js"
compatibility_date = "2024-01-01"

# Create this with: wrangler kv namespace create SAVED_KV
# then paste the id it prints below.
kv_namespaces = [
  { binding = "SAVED_KV", id = "719661e9da164f7fa37ac79291328724" }
]


d1_databases = [
  { binding = "SIGNAL_DB", database_name = "signal-db", database_id = "3c051f20-7eb2-4c1e-962f-456b4f23623a" }
]

[vars]
# Your GitHub Pages origin, so only your own site's requests are accepted.
ALLOWED_ORIGIN = "https://primetimeplayer.github.io"

# SYNC_TOKEN is a secret, NOT set here -- see the README in this folder.
# Set it with: wrangler secret put SYNC_TOKEN
